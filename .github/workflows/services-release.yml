name: services release

# Images are built only from a signed services-vX.Y.Z tag, published by digest and attested with
# their build provenance; the host verifies the attestations and pulls the images by digest from
# deployments/<network>.json, so the running code always traces to a tag. The tag name reaches a
# shell only through an environment variable, and only once it has that form.
on:
  push:
    tags: ["services-v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag name
        env:
          TAG: ${{ github.ref_name }}
        run: '[[ "$TAG" =~ ^services-v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      # The allowed signers live in a repository variable, one "principal key" line per maintainer
      # in ssh-keygen allowed_signers format; without them nothing is released.
      - name: Verify the tag signature
        env:
          ALLOWED_SIGNERS: ${{ vars.SERVICES_RELEASE_SIGNERS }}
          TAG: ${{ github.ref_name }}
        run: |
          test -n "$ALLOWED_SIGNERS"
          printf '%s\n' "$ALLOWED_SIGNERS" > "$RUNNER_TEMP/allowed_signers"
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git cat-file -t "$TAG")" = tag
          git verify-tag "$TAG"
          # The signed tag must name itself and point at the commit this run builds, so a tag
          # moved to another signed tag object cannot release an unsigned commit.
          git cat-file tag "$TAG" | grep -qx "tag $TAG"
          test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"

  images:
    needs: verify
    runs-on: ubuntu-latest
    # The environment holds the job until a maintainer approves the release.
    environment: services-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        service: [indexer, relayer, keeper, screening, watcher]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ github.ref_name }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.ref_name }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record the digest
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$SERVICE $IMAGE@$DIGEST commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
