name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo build --target wasm32v1-none --release
      - run: cargo test

  # Anyone can rebuild the deployed mainnet vault from this repository: the build with the
  # ceremony key must give the wasm hash the deployment record names. It runs on an Apple silicon
  # host, as the deployed build did: cargo mixes the host triple into symbol hashes, and those set
  # the function order, so a Linux build holds the same code in another order and hashes apart.
  mainnet-vault:
    runs-on: macos-15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: wasm32v1-none
      - name: Build the mainnet vault and compare it with the deployed hash
        # The remap keeps the build path of registry crates out of the wasm, so the hash does not
        # depend on where cargo keeps them.
        run: |
          RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=/cargo" \
            cargo build --target wasm32v1-none --release --locked --features mainnet
          built=$(shasum -a 256 target/wasm32v1-none/release/vault.wasm | cut -d' ' -f1)
          deployed=$(jq -r '.vaults[] | select(.asset == "native") | .wasm_hash' ../deployments/mainnet.json)
          echo "built    $built"
          echo "deployed $deployed"
          test "$built" = "$deployed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vault-mainnet-wasm
          path: contracts/target/wasm32v1-none/release/vault.wasm
          if-no-files-found: error

  circuits:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: circuits/package-lock.json
      - name: Install circom 2.2.3
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/circom" \
            https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          echo "85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3  $RUNNER_TEMP/bin/circom" \
            | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/circom"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: test "$(circom --version)" = "circom compiler 2.2.3"
      - run: npm ci
      - run: npm run format:check
      # Compiles with --O2 and fails unless the r1cs has the frozen constraint count and SHA-256.
      - run: npm run compile
      - id: ptau
        run: |
          node --input-type=module -e 'import { PTAU_BLAKE2B } from "./scripts/ptau.mjs"; console.log(`blake2b=${PTAU_BLAKE2B}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: circuits/build/ptau
          key: ptau-${{ steps.ptau.outputs.blake2b }}
      - run: npm run ptau
      - run: npm test
      - run: npm run check:o2
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/circomspect
          key: circomspect-0.9.0-${{ runner.os }}
      - run: command -v circomspect || cargo install circomspect --version 0.9.0 --locked
      - run: npm run circomspect

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            circuits/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      # The sample runs against live testnet and waits for a deposit's admission, so CI only
      # typechecks it, against the packages as built.
      - run: npm run build
      - run: npm run typecheck:examples
      # Real proofs need the frozen circuit and a dev proving key, set up fresh here; the proof
      # tests verify against the key exported from it.
      - name: Install circom 2.2.3
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/circom" \
            https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          echo "85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3  $RUNNER_TEMP/bin/circom" \
            | sha256sum --check
          chmod +x "$RUNNER_TEMP/bin/circom"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm ci
        working-directory: circuits
      - id: ptau
        working-directory: circuits
        run: |
          node --input-type=module -e 'import { PTAU_BLAKE2B } from "./scripts/ptau.mjs"; console.log(`blake2b=${PTAU_BLAKE2B}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: circuits/build/ptau
          key: ptau-${{ steps.ptau.outputs.blake2b }}
      - run: npm run setup:testnet-forgeable
        working-directory: circuits
      - run: npm run test:proof
