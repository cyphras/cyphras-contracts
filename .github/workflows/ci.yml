name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  stellar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stellar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - run: cargo test
      - run: cargo build --target wasm32v1-none --release
