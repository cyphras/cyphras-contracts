name: services

on:
  push:
    branches: [main, dev]
    paths: ["services/**", "circuits/test/vectors/**", ".github/workflows/services.yml"]
  pull_request:
    paths: ["services/**", "circuits/test/vectors/**", ".github/workflows/services.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go mod verify
      # Each test that needs Postgres creates its own database on this server.
      - run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
