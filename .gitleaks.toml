# Extends the default gitleaks ruleset. Deployment manifests hold only public on-chain identifiers
# (Stellar account and contract IDs, wasm hashes), and the circuit test vectors derive every key from
# the published all-"abandon" test mnemonic, so both are allowlisted; every other path is still
# scanned with the full default ruleset.
[extend]
useDefault = true

[allowlist]
description = "Deployment manifests and circuit test vectors hold no secrets"
paths = [
  '''deployments/.*\.json$''',
  '''^circuits/test/vectors/[a-z-]+\.json$''',
]
