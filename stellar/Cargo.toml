[workspace]
resolver = "2"
members = ["pool", "verifier", "factory"]

[workspace.dependencies]
soroban-sdk = "26.1.0"
soroban-poseidon = "26.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
