# Included in the http block. Clients reach the services only through these locations; the keeper,
# the watcher and the screening service's internal endpoint have none.
#
# Logging policy: no access log anywhere. The server blocks log errors only at emerg: nginx logs
# some TLS handshake failures at crit with the client address, which the policy never keeps;
# startup errors still reach the main error log. Rate-limit rejections log below that.
# Per-client limits key on the client address in shared memory, and the address is never passed
# on: the services cannot see it.

# An IPv6 client is keyed by its /64, the block one host holds, so it cannot spread over many
# addresses. nginx writes the longest run of zero groups of an address as "::", so the first four
# groups take a form that depends on where the zeros are; each rule below writes them out in full,
# by how many groups come before the "::" and after it, so every address of a /64 gets one key. An
# IPv4 address, also one written inside an IPv6 address, keys on itself. The key is never empty,
# since an empty key would not be limited at all. deploy/nginx_test.go checks these rules.
map $remote_addr $cy_client {
  "~\." $binary_remote_addr;
  "~^(?<cy1>[0-9a-f]{1,4}):(?<cy2>[0-9a-f]{1,4}):(?<cy3>[0-9a-f]{1,4}):(?<cy4>[0-9a-f]{1,4}):" "6:$cy1:$cy2:$cy3:$cy4";
  "~^(?<cy1>[0-9a-f]{1,4}):(?<cy2>[0-9a-f]{1,4}):(?<cy3>[0-9a-f]{1,4})::" "6:$cy1:$cy2:$cy3:0";
  "~^(?<cy1>[0-9a-f]{1,4}):(?<cy2>[0-9a-f]{1,4})::" "6:$cy1:$cy2:0:0";
  "~^(?<cy1>[0-9a-f]{1,4})::(?<cy4>[0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$" "6:$cy1:0:0:$cy4";
  "~^(?<cy1>[0-9a-f]{1,4})::" "6:$cy1:0:0:0";
  "~^::(?<cy3>[0-9a-f]{1,4}):(?<cy4>[0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$" "6:0:0:$cy3:$cy4";
  "~^::(?<cy4>[0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$" "6:0:0:0:$cy4";
  "~^::" "6:0:0:0:0";
  default $binary_remote_addr;
}

# A /48 is what one site holds, and a client with one has 65,536 /64s to spread over, so each limit
# also applies to the /48 as a whole, at four times the rate, built the same way from three groups.
map $remote_addr $cy_site {
  "~\." $binary_remote_addr;
  "~^(?<cy1>[0-9a-f]{1,4}):(?<cy2>[0-9a-f]{1,4}):(?<cy3>[0-9a-f]{1,4}):" "6:$cy1:$cy2:$cy3";
  "~^(?<cy1>[0-9a-f]{1,4}):(?<cy2>[0-9a-f]{1,4})::" "6:$cy1:$cy2:0";
  "~^(?<cy1>[0-9a-f]{1,4})::" "6:$cy1:0:0";
  "~^::(?<cy3>[0-9a-f]{1,4})(:[0-9a-f]{1,4}){5}$" "6:0:0:$cy3";
  "~^::" "6:0:0:0";
  default $binary_remote_addr;
}

limit_req_zone $cy_client zone=cy_read:10m rate=10r/s;
limit_req_zone $cy_client zone=cy_submit:10m rate=30r/m;
limit_req_zone $cy_client zone=cy_report:10m rate=5r/m;
limit_conn_zone $cy_client zone=cy_stream:10m;
limit_req_zone $cy_site zone=cy_site_read:10m rate=40r/s;
limit_req_zone $cy_site zone=cy_site_submit:10m rate=120r/m;
limit_req_zone $cy_site zone=cy_site_report:10m rate=20r/m;
limit_conn_zone $cy_site zone=cy_site_stream:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level notice;
limit_conn_log_level notice;

server {
  listen 80;
  listen [::]:80;
  server_name private.cyphras.com;
  access_log off;
  error_log /var/log/nginx/cyphras-error.log emerg;
  location /.well-known/acme-challenge/ {
    root /var/www/acme;
  }
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name private.cyphras.com;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/private.cyphras.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/private.cyphras.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_tickets off;
  add_header Strict-Transport-Security "max-age=63072000" always;

  access_log off;
  error_log /var/log/nginx/cyphras-error.log emerg;

  client_max_body_size 8k;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  # Nothing that identifies the client reaches a service.
  proxy_set_header X-Forwarded-For "";
  proxy_set_header X-Real-IP "";
  proxy_set_header Forwarded "";
  proxy_set_header User-Agent "";
  proxy_set_header Referer "";
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";

  # Testnet XLM vault.
  location = /testnet/xlm/indexer/v1/stream {
    limit_conn cy_stream 4;
    limit_conn cy_site_stream 16;
    proxy_pass http://127.0.0.1:18080/v1/stream;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  location /testnet/xlm/indexer/ {
    limit_req zone=cy_read burst=40 nodelay;
    limit_req zone=cy_site_read burst=160 nodelay;
    proxy_pass http://127.0.0.1:18080/;
  }
  location = /testnet/xlm/relayer/v1/submit {
    limit_req zone=cy_submit burst=5 nodelay;
    limit_req zone=cy_site_submit burst=20 nodelay;
    client_max_body_size 32k;
    # A submission answers once the network holds the transaction, which can take minutes.
    proxy_read_timeout 180s;
    proxy_pass http://127.0.0.1:18081/v1/submit;
  }
  location /testnet/xlm/relayer/ {
    limit_req zone=cy_read burst=20 nodelay;
    limit_req zone=cy_site_read burst=80 nodelay;
    proxy_pass http://127.0.0.1:18081/;
  }
  location = /testnet/screening/v1/self-report {
    limit_req zone=cy_report burst=2 nodelay;
    limit_req zone=cy_site_report burst=8 nodelay;
    proxy_pass http://127.0.0.1:18090/v1/self-report;
  }
  location /testnet/screening/internal/ {
    return 404;
  }
  location /testnet/screening/ {
    limit_req zone=cy_read burst=20 nodelay;
    limit_req zone=cy_site_read burst=80 nodelay;
    proxy_pass http://127.0.0.1:18090/;
  }

  # Mainnet XLM vault.
  location = /mainnet/xlm/indexer/v1/stream {
    limit_conn cy_stream 4;
    limit_conn cy_site_stream 16;
    proxy_pass http://127.0.0.1:28080/v1/stream;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  location /mainnet/xlm/indexer/ {
    limit_req zone=cy_read burst=40 nodelay;
    limit_req zone=cy_site_read burst=160 nodelay;
    proxy_pass http://127.0.0.1:28080/;
  }
  location = /mainnet/xlm/relayer/v1/submit {
    limit_req zone=cy_submit burst=5 nodelay;
    limit_req zone=cy_site_submit burst=20 nodelay;
    client_max_body_size 32k;
    # A submission answers once the network holds the transaction, which can take minutes.
    proxy_read_timeout 180s;
    proxy_pass http://127.0.0.1:28081/v1/submit;
  }
  location /mainnet/xlm/relayer/ {
    limit_req zone=cy_read burst=20 nodelay;
    limit_req zone=cy_site_read burst=80 nodelay;
    proxy_pass http://127.0.0.1:28081/;
  }
  location = /mainnet/screening/v1/self-report {
    limit_req zone=cy_report burst=2 nodelay;
    limit_req zone=cy_site_report burst=8 nodelay;
    proxy_pass http://127.0.0.1:28090/v1/self-report;
  }
  location /mainnet/screening/internal/ {
    return 404;
  }
  location /mainnet/screening/ {
    limit_req zone=cy_read burst=20 nodelay;
    limit_req zone=cy_site_read burst=80 nodelay;
    proxy_pass http://127.0.0.1:28090/;
  }

  location / {
    return 404;
  }
}
