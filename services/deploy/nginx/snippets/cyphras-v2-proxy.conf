# Installed as /etc/nginx/snippets/cyphras-v2-proxy.conf and included by every proxied location of
# private.cyphras.com: no access log, 429 on limits, and nothing that identifies the client reaches
# a service. Rate-limit rejections log at notice, below the emerg level the server keeps.
access_log off;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level notice;
limit_conn_log_level notice;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Real-IP "";
proxy_set_header Forwarded "";
proxy_set_header User-Agent "";
proxy_set_header Referer "";
proxy_set_header Cookie "";
proxy_set_header Authorization "";
